# Blueprint de Render para el entorno de pruebas de RapiChonta.
# Render lo detecta automáticamente con el nombre render.yaml en la raíz.
# Guía: Docs/08-despliegue-render.md

databases:
  - name: rapichonta-db
    plan: free
    databaseName: rapichonta
    user: rapichonta
    postgresMajorVersion: "16"

services:
  - type: web
    name: rapichonta-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # --include=dev: NODE_ENV=production haría que npm omita la CLI de Nest y de Prisma.
    # Aplica migraciones (incluye CREATE EXTENSION postgis) antes de arrancar.
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    branch: develop
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rapichonta-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # p. ej. https://rapichonta-web.onrender.com

  - type: web
    name: rapichonta-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    branch: develop
    buildFilter:
      paths:
        - web/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false # p. ej. https://rapichonta-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/liberty
