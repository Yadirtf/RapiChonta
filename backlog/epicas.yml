# Backlog inicial de RapiChonta: épicas e historias de usuario.
#
# Este archivo es la semilla del backlog. El flujo "Backlog" (GitHub Actions)
# crea en GitHub un issue por cada épica e historia que todavía no exista,
# enlaza cada historia como sub-issue de su épica y no vuelve a tocar los
# issues que ya creó: desde ese momento el issue es la fuente de verdad.
# Para agregar trabajo nuevo, agréguelo aquí (con un id nuevo) o cree el
# issue desde las plantillas de GitHub. Ver Docs/12-flujo-de-trabajo.md.
#
# Campos de una historia: id, titulo, como, quiero, para, areas, prioridad,
# requerimientos (ids de backlog/requerimientos.yml), criterios (al menos 2)
# y, opcionales, fase (si difiere de la épica) y notas.

epicas:
  # ═══════════════════════════ FASE 1 ═══════════════════════════
  - id: E01
    titulo: Identidad y acceso
    fase: 1
    prioridad: alta
    areas: [api, web, app]
    objetivo: "Que clientes, domiciliarios, operadores y administradores entren con su cuenta y solo vean lo que su rol permite (módulo identity)."
    terminado: "Un cliente inicia sesión con su celular, un operador entra al panel y un domiciliario creado por el administrador inicia sesión en la app, cada uno con los permisos de su rol."
    docs: [Docs/06-seguridad.md, Docs/04-modelo-de-datos.md]
    historias:
      - id: H01.1
        titulo: Iniciar sesión con celular y código
        como: cliente
        quiero: "registrarme e iniciar sesión con mi número de celular y un código que me llega por SMS o WhatsApp"
        para: "pedir sin crear ni recordar contraseñas"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-01, RF-02, RF-07, RNF-02]
        criterios:
          - "La sesión se pide solo al confirmar el pedido, no al abrir la app ni la web."
          - "Acepta números colombianos e internacionales en formato E.164."
          - "El código tiene 6 dígitos, vence a los 5 minutos y se bloquea tras 5 intentos fallidos."
          - "No se envían más de 3 códigos por hora al mismo número; el límite de peticiones del endpoint es más estricto que el global."
          - "En el primer ingreso el cliente acepta la política de tratamiento de datos y queda registrada la fecha de aceptación."
          - "Tras validar el código se emiten token de acceso (15 min) y de refresco rotativo (30 días): en la web en cookie HttpOnly, en la app en almacenamiento seguro."
          - "Cerrar sesión revoca el token de refresco en la base de datos."
        notas: "Proveedor de SMS detrás de un puerto (por ejemplo Twilio Verify) con un adaptador falso para desarrollo y pruebas."
      - id: H01.2
        titulo: Roles y permisos en cada endpoint
        como: equipo de RapiChonta
        quiero: "que cada endpoint valide el rol y la propiedad de los datos"
        para: "que nadie vea ni cambie pedidos o datos que no le corresponden"
        areas: [api]
        prioridad: alta
        requerimientos: [RF-03, RF-06, RNF-01]
        criterios:
          - "Existen guards de NestJS por rol (CUSTOMER, COURIER, OPERATOR, ADMIN) aplicados con un decorador."
          - "Un cliente que pide un pedido ajeno recibe 404, no 403, para no revelar que existe."
          - "Un domiciliario solo ve los pedidos que se le ofrecieron o aceptó, y solo mientras están activos."
          - "La dirección exacta y el teléfono de quien recibe se muestran al domiciliario solo desde ON_THE_WAY."
          - "Hay pruebas unitarias de los guards y de la regla de propiedad."
      - id: H01.3
        titulo: Crear y verificar domiciliarios
        como: administrador
        quiero: "crear la cuenta de cada domiciliario con sus datos, documentos y cuentas de cobro"
        para: "que solo personas verificadas por RapiChonta hagan domicilios"
        areas: [api, web]
        prioridad: alta
        requerimientos: [RF-04, RF-05]
        criterios:
          - "El formulario registra nombre, documento, teléfono, modo de financiación (caja diaria o dinero propio) y cuentas Nequi/Daviplata/banco para el QR."
          - "El domiciliario no puede recibir ofertas hasta que el administrador lo marca como verificado."
          - "No existe un endpoint ni pantalla para que un cliente se convierta en domiciliario."
          - "El administrador puede desactivar un domiciliario; sus sesiones quedan revocadas."
      - id: H01.4
        titulo: Acceso al panel para operadores y administradores
        como: operador
        quiero: "entrar al panel web con mi celular, código y contraseña"
        para: "gestionar pedidos con una cuenta más protegida que la de un cliente"
        areas: [api, web]
        prioridad: alta
        requerimientos: [RF-05, RF-02, RF-03]
        criterios:
          - "Las cuentas de personal piden código más contraseña; los clientes nunca ven ese formulario."
          - "El panel (/panel) redirige al inicio de sesión si no hay sesión de OPERATOR o ADMIN."
          - "El administrador crea operadores y puede desactivarlos."
          - "Las opciones exclusivas del administrador no aparecen para el operador y la API las rechaza."
      - id: H01.5
        titulo: Mi cuenta con mis datos e idioma
        como: cliente
        quiero: "ver y corregir mis datos, cambiar el idioma y pedir que se eliminen mis datos"
        para: "controlar mi información como lo exige la ley"
        areas: [api, web, app]
        prioridad: media
        requerimientos: [RF-07, RNF-03]
        criterios:
          - "Mi cuenta muestra nombre, teléfono y direcciones guardadas, y permite editarlos."
          - "El idioma (español o inglés) se puede cambiar y se recuerda."
          - "La solicitud de eliminación anonimiza los datos personales sin borrar el historial de pedidos necesario para la contabilidad."
          - "Hay un enlace visible a la política de tratamiento de datos."

  - id: E02
    titulo: Establecimientos y menús
    fase: 1
    prioridad: alta
    areas: [api, web, app]
    objetivo: "Que RapiChonta registre los locales de Villagarzón con su área en el mapa y su menú, y que el cliente los encuentre en el mapa."
    terminado: "Los locales del piloto están cargados con área y menú, y el cliente los ve en el mapa y en su ficha."
    docs: [Docs/04-modelo-de-datos.md, Docs/05-flujos-y-ux.md]
    historias:
      - id: H02.1
        titulo: Registrar establecimientos con área en el mapa
        como: administrador
        quiero: "registrar un establecimiento con su punto y dibujar su área en el mapa"
        para: "que aparezca en el mapa y la app detecte cuándo el domiciliario llegó"
        areas: [api, web]
        prioridad: alta
        requerimientos: [RF-10, RNF-11]
        criterios:
          - "El formulario pide nombre, categoría, dirección, teléfono, punto en el mapa y un polígono dibujado con MapLibre."
          - "La API rechaza polígonos inválidos o que no contienen el punto del local."
          - "Se puede editar y desactivar un establecimiento; uno inactivo no aparece en el mapa del cliente."
          - "El punto y el área se guardan como geography con índice GIST."
      - id: H02.2
        titulo: Administrar el menú de un establecimiento
        como: operador
        quiero: "crear y editar productos con precio, detalle, foto, tiempo de preparación y disponibilidad"
        para: "que el cliente vea precios y tiempos reales"
        areas: [api, web]
        prioridad: alta
        requerimientos: [RF-11, RNF-05]
        criterios:
          - "Operadores y administradores pueden crear, editar, ordenar y marcar como no disponible un producto."
          - "Los precios se guardan en Decimal(12,2) en COP."
          - "Un producto no disponible no se puede agregar al carrito."
          - "Cambiar un precio no altera los pedidos ya creados."
      - id: H02.3
        titulo: Subir fotos de productos
        como: operador
        quiero: "subir la foto de cada producto"
        para: "que el cliente reconozca lo que pide"
        areas: [api, web]
        prioridad: media
        requerimientos: [RNF-08]
        criterios:
          - "La subida usa una URL firmada con vencimiento hacia el almacenamiento de archivos (R2 o S3)."
          - "Solo se aceptan JPEG, PNG o WebP de hasta 5 MB."
          - "La imagen se muestra optimizada en la web y la app."
        notas: "El mismo mecanismo se reutiliza para las fotos de factura y de entrega (H08.4 y H10.4)."
      - id: H02.4
        titulo: Filtrar el mapa por categoría
        como: cliente
        quiero: "filtrar los establecimientos del mapa por categoría y abrir la tarjeta de un local"
        para: "encontrar rápido dónde pedir"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-12, RNF-04, RNF-11]
        criterios:
          - "Las categorías del menú lateral filtran el mapa y se pueden combinar."
          - "El mapa se centra en el usuario si comparte ubicación; si no, en Villagarzón con una invitación a activarla."
          - "Al tocar un marcador sube la tarjeta con nombre, distancia y botón Pedir aquí."
          - "Los datos salen de la base (PostGIS), no de datos en memoria."
        notas: "La base ya muestra el mapa y los cercanos (Fase 0); esta historia agrega filtros, tarjeta y datos reales."
      - id: H02.5
        titulo: Ver la ficha y el menú de un establecimiento
        como: cliente
        quiero: "ver el menú de un establecimiento con precio, foto y tiempo de preparación"
        para: "elegir qué pedir"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-13, RF-17, RNF-03]
        criterios:
          - "La ficha muestra nombre, categoría, distancia y los productos disponibles agrupados por sección."
          - "Cada producto muestra precio en COP, foto, detalle y tiempo estimado de preparación."
          - "Desde la ficha se agregan productos al carrito."
          - "La ficha funciona en español e inglés."
      - id: H02.6
        titulo: Cargar el catálogo inicial de Villagarzón
        como: administrador
        quiero: "cargar los establecimientos y menús reales del piloto"
        para: "que los primeros clientes tengan dónde pedir"
        areas: [api, docs]
        prioridad: media
        requerimientos: [RF-10, RF-11]
        criterios:
          - "Hay una forma documentada de cargar locales y productos (panel o importación desde CSV)."
          - "Los locales del piloto tienen punto, área, categoría y menú con precios y tiempos."
          - "La carga se puede repetir sin duplicar registros."

  - id: E03
    titulo: Zonas, horario y configuración del negocio
    fase: 1
    prioridad: alta
    areas: [api, web]
    objetivo: "Que el administrador configure tarifas por zona, horario de operación, comisión y demás parámetros sin desplegar."
    terminado: "Cambiar una tarifa, el horario o la comisión en el panel se refleja en el siguiente pedido."
    docs: [Docs/04-modelo-de-datos.md, Docs/05-flujos-y-ux.md]
    historias:
      - id: H03.1
        titulo: Zonas de entrega con tarifa fija
        como: administrador
        quiero: "dibujar zonas en el mapa y asignarles una tarifa"
        para: "cobrar el domicilio según el barrio o la vereda"
        areas: [api, web]
        prioridad: alta
        requerimientos: [RF-14, RNF-05]
        criterios:
          - "Se crean zonas URBAN (barrios del casco urbano) y RURAL (rangos de veredas) con nombre, polígono y tarifa."
          - "La API calcula la tarifa con la zona que contiene el punto de entrega (ST_Covers)."
          - "Si el punto no cae en ninguna zona, la API responde que no hay cobertura y el cliente lo ve antes de confirmar."
          - "Si dos zonas se solapan, el panel lo advierte al guardar."
      - id: H03.2
        titulo: Horario de operación
        como: administrador
        quiero: "definir el horario por día de la semana"
        para: "que no entren pedidos cuando no hay domiciliarios"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-15]
        criterios:
          - "El horario se define por día en hora de Colombia (America/Bogota), con una o varias franjas."
          - "Fuera de horario, el botón de pedir muestra la próxima apertura (por ejemplo Abrimos a las 8:00 a. m.)."
          - "La API rechaza crear pedidos fuera de horario aunque el cliente lo intente directamente."
      - id: H03.3
        titulo: Parámetros del negocio en el panel
        como: administrador
        quiero: "cambiar la comisión, el tope para clientes nuevos y los tiempos de espera desde el panel"
        para: "ajustar la operación sin desplegar"
        areas: [api, web]
        prioridad: media
        requerimientos: [RF-16, RF-73, RNF-07]
        criterios:
          - "El panel lista y edita los parámetros de AppSetting con su valor por defecto y una explicación."
          - "Los valores se validan (por ejemplo la comisión entre 0 y 100 %)."
          - "Cada cambio queda registrado con quién y cuándo."
          - "Un cambio de comisión no altera pedidos ya creados."
      - id: H03.4
        titulo: Precio aproximado en dólares o euros
        como: cliente extranjero
        quiero: "ver al lado de cada precio su valor aproximado en mi moneda"
        para: "entender cuánto voy a pagar"
        areas: [api, web, app]
        prioridad: baja
        requerimientos: [RF-17]
        criterios:
          - "La API guarda la tasa USD y EUR una vez al día desde un proveedor público."
          - "El cliente elige mostrar USD, EUR o ninguna; el valor aparece como aproximado (≈ US$ 6,10)."
          - "Si no hay tasa del día, se usa la última disponible y se indica la fecha."

      - id: H03.5
        titulo: Cobertura por municipio
        como: administrador
        quiero: "definir desde el panel hasta dónde llegan los domiciliarios en cada municipio, con un radio o un área dibujada"
        para: "abrir nuevos municipios sin desplegar y que el cliente sepa si llegamos a su ubicación"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-18, RF-14, RF-21]
        criterios:
          - "En el panel cada municipio tiene una cobertura: radio en metros alrededor del centro (la plaza) o un área dibujada, y una tarifa base."
          - "Un municipio se abre a pedidos solo con cobertura, horario y comisión; solo el administrador general lo abre o lo pausa."
          - "El cliente ve el área cubierta en el mapa y si su ubicación queda dentro; puede mover el pin (por ejemplo, para otra persona) y la API valida ese punto."
          - "Fuera de la cobertura no se puede pedir y se indica a qué distancia empieza."

  - id: E04
    titulo: Pedido del cliente
    fase: 1
    prioridad: alta
    areas: [api, web, app]
    objetivo: "Que el cliente arme un pedido con el menú real, elija dirección y medio de pago, lo confirme y lo siga en Mis pedidos."
    terminado: "Un cliente puede armar un pedido con el menú real de un local de Villagarzón y verlo en Mis pedidos (criterio de la Fase 1)."
    docs: [Docs/05-flujos-y-ux.md, Docs/04-modelo-de-datos.md]
    historias:
      - id: H04.1
        titulo: Carrito con total y tarifa
        como: cliente
        quiero: "agregar productos al carrito y ver el total con la tarifa del domicilio"
        para: "saber cuánto voy a pagar antes de confirmar"
        areas: [web, app]
        prioridad: alta
        requerimientos: [RF-20, RNF-05]
        criterios:
          - "El carrito solo admite productos de un establecimiento; al agregar de otro se pregunta si se vacía."
          - "Se pueden cambiar cantidades y quitar productos."
          - "El total muestra productos, tarifa de la zona y total a pagar."
          - "El carrito se conserva si el cliente cierra y vuelve a abrir la app."
      - id: H04.2
        titulo: Elegir la dirección de entrega
        como: cliente
        quiero: "usar mi ubicación actual o marcar un punto en el mapa, con una referencia"
        para: "que el domiciliario encuentre dónde entregar, también si el pedido es para otra persona"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-21, RF-14]
        criterios:
          - "El cliente elige entre ubicación actual o punto en el mapa y escribe una referencia (casa azul, segundo piso)."
          - "Puede marcar que el pedido es para otra persona e ingresar su nombre y teléfono."
          - "Las direcciones se guardan para reutilizarlas."
          - "Si el punto está fuera de las zonas, se informa que no hay cobertura."
      - id: H04.3
        titulo: Confirmar el pedido
        como: cliente
        quiero: "elegir cómo pagaré y confirmar el pedido"
        para: "que RapiChonta lo compre y me lo lleve"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-22, RF-15, RF-16, RNF-01, RNF-05]
        criterios:
          - "El cliente elige el medio de pago contra entrega: efectivo, Nequi, Daviplata o transferencia."
          - "El pedido se crea con código RC-XXXX, estado PENDING_ASSIGNMENT y copia nombre, precio y tiempo de cada producto."
          - "Un cliente sin pedidos entregados no puede superar el tope configurado (100.000 COP) y ve el motivo."
          - "No se puede confirmar fuera de horario ni con productos no disponibles."
          - "El caso de uso CreateOrder tiene pruebas unitarias de tope, horario y totales."
      - id: H04.4
        titulo: Mis pedidos
        como: cliente
        quiero: "ver mis pedidos activos con su estado y el historial"
        para: "saber en qué va mi pedido y revisar los anteriores"
        areas: [api, web, app]
        prioridad: alta
        requerimientos: [RF-23, RF-50]
        criterios:
          - "Los pedidos activos aparecen primero con su estado en lenguaje claro (Buscando domiciliario, En camino...)."
          - "El historial muestra fecha, establecimiento, total y estado final."
          - "El detalle muestra productos, dirección, medio de pago y línea de tiempo de estados."
          - "El cliente nunca ve la ubicación del domiciliario."

  - id: E05
    titulo: Calidad y entrega continua
    fase: 1
    prioridad: alta
    areas: [infra]
    objetivo: "Que cada cambio llegue a develop probado y que los errores en pruebas se vean sin buscarlos."
    terminado: "Todo PR corre lint, pruebas y build; main y develop están protegidas; los errores llegan a Sentry."
    docs: [Docs/09-convenciones.md, Docs/06-seguridad.md]
    historias:
      - id: H05.1
        titulo: CI con lint, pruebas y build en cada PR
        como: equipo de RapiChonta
        quiero: "que cada PR verifique api, web y app con GitHub Actions"
        para: "no romper develop ni el despliegue de pruebas"
        areas: [infra]
        prioridad: alta
        requerimientos: [RNF-09, RNF-01]
        criterios:
          - "api: npm ci, prisma generate, lint, test y build."
          - "web: npm ci, lint, typecheck y build."
          - "app: flutter analyze y flutter test."
          - "Cada trabajo corre solo si el PR cambia esa carpeta y usa caché de dependencias."
          - "El build del Dockerfile raíz se verifica en los PR que lo tocan."
      - id: H05.2
        titulo: Revisión de dependencias
        como: equipo de RapiChonta
        quiero: "recibir PR automáticos de actualización y alertas de vulnerabilidades"
        para: "mantener las dependencias seguras"
        areas: [infra]
        prioridad: media
        requerimientos: [RNF-12]
        criterios:
          - "Dependabot revisa semanalmente npm (api, web), pub (app), Docker y GitHub Actions, con PR hacia develop."
          - "CI ejecuta npm audit con nivel high y falla si hay vulnerabilidades altas."
      - id: H05.3
        titulo: Proteger main y develop
        como: equipo de RapiChonta
        quiero: "que main y develop solo reciban cambios por PR con CI en verde"
        para: "que nadie despliegue por accidente código sin revisar"
        areas: [infra, docs]
        prioridad: media
        requerimientos: [RNF-09]
        criterios:
          - "Reglas de protección: sin push directo, PR obligatorio y checks de CI requeridos."
          - "La configuración queda documentada en Docs/09-convenciones.md."
      - id: H05.4
        titulo: Errores en Sentry y logs estructurados
        como: equipo de RapiChonta
        quiero: "ver los errores de api, web y app en Sentry"
        para: "detectar fallos del piloto antes de que los clientes los reporten"
        areas: [api, web, app, infra]
        prioridad: media
        fase: 2
        requerimientos: [RNF-10]
        criterios:
          - "Los tres proyectos envían errores a Sentry con el entorno (pruebas o producción) y la versión."
          - "La API escribe logs en JSON con id de petición."
          - "Ningún dato personal (teléfono, dirección) viaja en los eventos."

  # ═══════════════════════════ FASE 2 ═══════════════════════════
  - id: E06
    titulo: Notificaciones push
    fase: 2
    prioridad: alta
    areas: [api, app]
    objetivo: "Que domiciliarios y clientes reciban avisos en el teléfono, también en Huawei."
    terminado: "Un domiciliario recibe la oferta por push en Android, iOS y Huawei y el cliente recibe los cambios de estado."
    docs: [Docs/02-stack-tecnologico.md]
    historias:
      - id: H06.1
        titulo: Registrar dispositivos y enviar push
        como: equipo de RapiChonta
        quiero: "registrar el token de cada dispositivo y enviar notificaciones por FCM y Huawei Push Kit"
        para: "avisar a domiciliarios y clientes aunque no tengan la app abierta"
        areas: [api, app]
        prioridad: alta
        requerimientos: [RF-34]
        criterios:
          - "La app registra su token al iniciar sesión indicando el proveedor (FCM o HMS) y lo borra al cerrar sesión."
          - "La API envía por el proveedor correcto a través de un puerto con un adaptador falso para pruebas."
          - "Los tokens inválidos se eliminan cuando el proveedor los rechaza."
      - id: H06.2
        titulo: Avisos al cliente por cambio de estado
        como: cliente
        quiero: "recibir una notificación cuando mi pedido cambie de estado"
        para: "no tener que estar mirando la app"
        areas: [api, app]
        prioridad: media
        requerimientos: [RF-34, RF-50, RNF-03]
        criterios:
          - "Se notifica al aceptar, en el establecimiento, en camino, llegando y entregado."
          - "El texto llega en el idioma del cliente."
          - "Tocar la notificación abre el pedido."

  - id: E07
    titulo: Asignación de pedidos por el operador
    fase: 2
    prioridad: alta
    areas: [api, web]
    objetivo: "Que el operador vea los pedidos nuevos y los domiciliarios cercanos y envíe cada pedido a uno o a todos."
    terminado: "Un pedido nuevo se envía desde el panel y el primer domiciliario que acepta lo toma sin dobles asignaciones."
    docs: [Docs/05-flujos-y-ux.md]
    historias:
      - id: H07.1
        titulo: Alerta de pedido nuevo en el panel
        como: operador
        quiero: "escuchar una alerta y ver resaltado cada pedido nuevo"
        para: "asignarlo sin demora"
        areas: [web, api]
        prioridad: alta
        requerimientos: [RF-30]
        criterios:
          - "El panel consulta pedidos nuevos cada pocos segundos (tiempo real llega en la Fase 3)."
          - "Un pedido nuevo suena una vez y queda resaltado hasta que se envía."
          - "Se ve el tiempo que lleva cada pedido sin domiciliario."
      - id: H07.2
