<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="RapiChonta">
  <defs>
    <!-- Piel del chontaduro: rojo arriba, naranja y amarillo hacia la punta -->
    <linearGradient id="rc-chonta" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#B83A1B"/>
      <stop offset="0.45" stop-color="#E4572E"/>
      <stop offset="1" stop-color="#F7A531"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="#FFC531"/>
  <!-- Líneas de velocidad: "Rapi" -->
  <path d="M5.5 21h5.5M4 26.5h7M6.5 32h4.5" stroke="#14121F" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Segundo fruto del racimo, detrás -->
  <ellipse cx="36.4" cy="18.6" rx="6" ry="7.6" transform="rotate(24 36.4 18.6)" fill="#C9461F" stroke="#14121F" stroke-width="2"/>
  <!-- Chontaduro principal con silueta de pin -->
  <path d="M26 43.5c-6.2-6-10.2-11.2-10.2-18.6 0-7 4.6-12.4 10.2-12.4s10.2 5.4 10.2 12.4c0 7.4-4 12.6-10.2 18.6z" fill="url(#rc-chonta)" stroke="#14121F" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Brillo de la piel -->
  <ellipse cx="21.8" cy="21" rx="2.1" ry="4.2" transform="rotate(18 21.8 21)" fill="#FFF7E2" fill-opacity=".85"/>
  <!-- Cáliz (capuchón) de la palma -->
  <path d="M26 10.2l1.7 2.4 2.9-.5-1.1 2.6H22.5l-1.1-2.6 2.9.5z" fill="#1F7A4D" stroke="#14121F" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
