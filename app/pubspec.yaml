name: rapichonta
description: App móvil de RapiChonta (Android, iOS, Huawei/HarmonyOS vía AppGallery y web).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Estado e inyección de dependencias
  flutter_riverpod: ^3.4.3
  # Navegación declarativa
  go_router: ^18.1.0
  # HTTP
  dio: ^5.7.0
  # Mapa con OpenStreetMap: no depende de Google Play Services (clave para Huawei)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Ubicación (usa LocationManager de Android cuando no hay GMS)
  geolocator: ^14.1.1
  equatable: ^3.0.0
  intl: any
  # Token de refresco en Keystore (Android, también Huawei sin GMS) / Keychain (iOS)
  flutter_secure_storage: ^11.2.0
  # Abrir los documentos legales publicados en la web
  url_launcher: ^6.3.3
  sentry_flutter: ^10.1.0
  # Notificaciones push (E06): FCM en Android con Google e iOS; Huawei Push Kit en teléfonos sin Google.
  # Firebase se configura por --dart-define (sin google-services.json ni plugin de Gradle).
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  huawei_push: ^6.15.0+300
  # Modo domiciliario (E08): foto de la factura, cola sin señal guardada en el teléfono y su huella SHA-256.
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Marca: emblema, mascota y paisaje del menú lateral (ver Docs/marca/generar_marca.py).
  assets:
    - assets/brand/
  # Genera AppLocalizations desde lib/l10n/*.arb
  generate: true
