# Etiquetas del repositorio. El flujo "Backlog" las crea o actualiza en GitHub
# cada vez que este archivo cambia en develop. Ver Docs/12-flujo-de-trabajo.md.
# Las etiquetas que no están aquí no se borran.

# Tipo de issue
- name: "tipo: épica"
  color: "5319E7"
  description: "Agrupa historias de una misma capacidad del producto"
- name: "tipo: historia"
  color: "1D76DB"
  description: "Historia de usuario con criterios de aceptación"
- name: "tipo: tarea"
  color: "0E8A16"
  description: "Trabajo técnico que no es una historia de usuario"
- name: "tipo: bug"
  color: "D73A4A"
  description: "Algo no funciona como debería"

# Estado (solo uno a la vez; lo mueve el flujo automático)
- name: "estado: backlog"
  color: "EDEDED"
  description: "Identificado, sin refinar o sin priorizar"
- name: "estado: listo"
  color: "C2E0C6"
  description: "Refinado y con criterios claros; se puede tomar"
- name: "estado: en progreso"
  color: "FBCA04"
  description: "Alguien (persona o agente) lo está trabajando"
- name: "estado: en revisión"
  color: "0075CA"
  description: "Tiene un PR listo para revisar"
- name: "estado: bloqueado"
  color: "B60205"
  description: "No puede avanzar; el motivo va en un comentario"
- name: "estado: hecho"
  color: "0E8A16"
  description: "Integrado en develop"

# Fase del roadmap (Docs/07-roadmap.md)
- name: "fase: 1"
  color: "BFD4F2"
  description: "Catálogo y pedido del cliente"
- name: "fase: 2"
  color: "BFD4F2"
  description: "Operación del domiciliario y piloto"
- name: "fase: 3"
  color: "D4C5F9"
  description: "Publicación y tiempo real"
- name: "fase: 4"
  color: "D4C5F9"
  description: "Pagos y crecimiento"
- name: "fase: 5"
  color: "D4C5F9"
  description: "Comercios aliados"

# Área del monorepo
- name: "área: api"
  color: "F9D0C4"
  description: "Backend NestJS (api/)"
- name: "área: web"
  color: "F9D0C4"
  description: "Next.js: cliente, operador y administrador (web/)"
- name: "área: app"
  color: "F9D0C4"
  description: "Flutter: cliente y domiciliario (app/)"
- name: "área: docs"
  color: "F9D0C4"
  description: "Documentación (Docs/)"
- name: "área: infra"
  color: "F9D0C4"
  description: "CI, despliegue, Docker y configuración del repositorio"

# Prioridad
- name: "prioridad: alta"
  color: "B60205"
  description: "Bloquea la fase actual"
- name: "prioridad: media"
  color: "FBCA04"
  description: "Necesaria para cerrar la fase"
- name: "prioridad: baja"
  color: "C5DEF5"
  description: "Mejora o fase futura"

# Asignación a agentes
- name: "agente: claude"
  color: "D97757"
  description: "Asignado a un agente Claude del proyecto"

# Dependencias (las pone Dependabot en sus PR; ver .github/dependabot.yml)
- name: "dependencias"
  color: "0366D6"
  description: "Actualización automática de dependencias"
