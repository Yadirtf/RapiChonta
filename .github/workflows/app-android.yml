# Compila la app Flutter (app/) como APK de Android para instalarla y probar los entornos.
# - En cada PR que toca app/: compila y deja el APK como artefacto del run.
# - En cada push a develop (y a mano desde Actions): además publica el APK en la pre-release
#   "app-develop", que se descarga directo desde el teléfono sin iniciar sesión en GitHub.
# La URL de la API se inyecta al compilar (--dart-define=API_URL); se puede cambiar con la
# variable del repositorio API_URL o con el campo "api_url" al lanzarlo a mano.
# Con la variable SENTRY_DSN_APP la app reporta sus errores a Sentry (entorno "pruebas").
# Notificaciones push (E06): las variables FIREBASE_* activan FCM y AGCONNECT_SERVICES_JSON (el
# agconnect-services.json de AppGallery Connect) activa Huawei Push Kit. Sin ellas la app compila igual
# y simplemente no registra token (ver Docs/11-despliegue-snapdeploy.md).
name: App Android

on:
  push:
    branches: [develop]
    paths:
      - "app/**"
      - ".github/workflows/app-android.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-android.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de la API (vacío = entorno de prueba en SnapDeploy)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Entorno de prueba: contenedor único en SnapDeploy (la web reenvía /api/* a NestJS).
  DEFAULT_API_URL: https://rapichonta-2bb49.containers.snapdeploy.app/api/v1

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: URL de la API
        id: api
        env:
          INPUT_URL: ${{ inputs.api_url }}
          REPO_URL: ${{ vars.API_URL }}
        run: |
          url="${INPUT_URL:-${REPO_URL:-$DEFAULT_API_URL}}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API_URL=$url" >> "$GITHUB_STEP_SUMMARY"

      # android/ no se versiona todavía (ver app/README.md): se genera en cada build.
      # sentry_flutter exige Android 8.0 (API 26) o superior; la plantilla trae el mínimo de Flutter (24).
      - name: Generar plataforma Android
        run: |
          flutter create . --org com.rapichonta --project-name rapichonta --platforms=android
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          grep -q 'minSdk = 26' android/app/build.gradle.kts

      # Ícono del lanzador y nombre visible: los recursos versionados en app/branding/android/res
      # (generados por Docs/marca/generar_marca.py) reemplazan los de la plantilla de flutter create.
      - name: Ícono y nombre de la app
        run: |
          cp -R branding/android/res/. android/app/src/main/res/
          cp branding/android/proguard-rules.pro android/app/proguard-rules.pro
          sed -i 's|android:label="rapichonta"|android:label="RapiChonta"|' android/app/src/main/AndroidManifest.xml

      # El manifiesto principal no trae INTERNET (solo el de debug); la ubicación la usa geolocator y
      # POST_NOTIFICATIONS es el permiso de avisos de Android 13+.
      - name: Permisos de Android
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          for p in INTERNET ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS; do
            grep -q "android.permission.$p\"" "$manifest" || \
              sed -i "s|<application|<uses-permission android:name=\"android.permission.$p\"/>\n    <application|" "$manifest"
          done
          cat "$manifest"

      # Huawei Push Kit: el SDK lee agconnect-services.json desde los assets y sus artefactos viven en el
      # repositorio Maven de Huawei, que la plantilla de flutter create no incluye.
      - name: Huawei Push Kit
        id: hms
        env:
          AGCONNECT_SERVICES_JSON: ${{ vars.AGCONNECT_SERVICES_JSON }}
        run: |
          cat >> android/build.gradle.kts <<'GRADLE'

          allprojects {
              repositories {
                  maven { url = uri("https://developer.huawei.com/repo/") }
              }
          }
          GRADLE
          enabled=false
          if [ -n "$AGCONNECT_SERVICES_JSON" ]; then
            mkdir -p android/app/src/main/assets
            printf '%s' "$AGCONNECT_SERVICES_JSON" > android/app/src/main/assets/agconnect-services.json
            cp android/app/src/main/assets/agconnect-services.json android/app/agconnect-services.json
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "HMS_PUSH_ENABLED=$enabled" >> "$GITHUB_STEP_SUMMARY"

      - run: flutter pub get

      # Release firmado con la clave de debug que genera flutter create: sirve para instalar y probar,
      # no para publicar en tiendas.
      - name: Compilar APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL=${{ steps.api.outputs.url }} \
            --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN_APP }} \
            --dart-define=SENTRY_ENVIRONMENT=pruebas \
            --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=HMS_PUSH_ENABLED=${{ steps.hms.outputs.enabled }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/rapichonta-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: rapichonta-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14

      - name: Publicar en la pre-release app-develop
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          gh release delete app-develop --cleanup-tag --yes || true
          gh release create app-develop dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "App de prueba (develop #${{ github.run_number }})" \
            --notes "APK de prueba compilado desde develop (${GITHUB_SHA::7}). API: $API_URL"
