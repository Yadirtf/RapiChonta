# Integración continua (H05.1): cada PR verifica solo las carpetas que cambia; cada push a develop y main
# verifica todo. El trabajo "CI" resume el resultado y es el único check que exige la protección de ramas
# (Docs/09-convenciones.md): un trabajo que no corre porque su carpeta no cambió cuenta como aprobado.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.filtro.outputs.api == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filtro.outputs.web == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.filtro.outputs.app == 'true' }}
      imagen: ${{ github.event_name != 'pull_request' || steps.filtro.outputs.imagen == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            api:
              - "api/**"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            app:
              - "app/**"
              - ".github/workflows/ci.yml"
            imagen:
              - "Dockerfile"
              - "start.sh"
              - ".dockerignore"
              - "api/package*.json"
              - "web/package*.json"

  api:
    name: API
    needs: cambios
    if: needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Misma base que producción (Neon): PostgreSQL 16 con PostGIS.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rapichonta
          POSTGRES_PASSWORD: rapichonta
          POSTGRES_DB: rapichonta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapichonta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rapichonta:rapichonta@localhost:5432/rapichonta?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Vulnerabilidades altas en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Lint (tipos)
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test -- --ci
      - name: Migraciones y semilla con datos de ejemplo
        run: npx prisma migrate deploy && npm run seed:dev
        env:
          SEED_ADMIN_PHONE: "3000000000"
          SEED_ADMIN_PASSWORD: Integracion-Continua-1
          SEED_DEMO_DATA: "true"
      - name: Pruebas contra PostgreSQL
        run: npm run test:db -- --ci
      - run: npm run build

  web:
    name: Web
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vulnerabilidades altas en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ hashFiles('web/package-lock.json') }}-
      - run: npm run build

  app:
    name: App
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  imagen:
    name: Imagen Docker
    needs: cambios
    if: needs.cambios.outputs.imagen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Solo se construye (no se publica): SnapDeploy compila la suya desde develop.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          # La acción sube un artefacto .dockerbuild por run (90 días por defecto); con 3 basta para depurar.
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 3

  ci:
    name: CI
    if: always()
    needs: [cambios, api, web, app, imagen]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        env:
          RESULTADOS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTADOS"
          if echo "$RESULTADOS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::Algún trabajo de CI falló o se canceló."
            exit 1
          fi
